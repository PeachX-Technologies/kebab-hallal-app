name: Build iOS IPA

on:
  push:
    branches: [main]
    paths:
      - "iOS-App/**"
      - ".github/workflows/build-ios.yml"
  workflow_dispatch:
  release:
    types: [published]

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build iOS IPA
    runs-on: macos-26
    defaults:
      run:
        working-directory: iOS-App

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: iOS-App/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Decode signing certificate
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
        run: |
          CERT_PATH="$RUNNER_TEMP/certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

          # Write certificate to file
          echo -n "$IOS_CERTIFICATE_BASE64" | base64 --decode > "$CERT_PATH"

          # Create and configure keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Import certificate
          security import "$CERT_PATH" -P "$IOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')

          # Find exact signing identity
          CERT_IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | head -1 | grep -o '".*"' | tr -d '"')
          echo "Found signing identity: $CERT_IDENTITY"

          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> $GITHUB_ENV
          echo "CERT_IDENTITY=$CERT_IDENTITY" >> $GITHUB_ENV

      - name: Decode provisioning profile
        env:
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          PROFILE_PATH="$RUNNER_TEMP/profile.mobileprovision"
          echo -n "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"

          # Install provisioning profile
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" /dev/stdin <<< "$(security cms -D -i "$PROFILE_PATH")")
          cp "$PROFILE_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/"$UUID".mobileprovision
          echo "PROFILE_UUID=$UUID" >> $GITHUB_ENV

      - name: Generate native iOS project
        run: npx expo prebuild --platform ios --clean

      - name: Copy RoutingAppCoverage asset
        run: |
          cp -R ios/KebabHallal/RoutingAppCoverage.xcassets ios/KebabHallal/RoutingAppCoverage.xcassets.bak 2>/dev/null || true
          rm -rf ios/KebabHallal/RoutingAppCoverage.xcassets
          mkdir -p ios/KebabHallal/RoutingAppCoverage.xcassets/RoutingAppCoverage.dataset
          cat > ios/KebabHallal/RoutingAppCoverage.xcassets/Contents.json << 'EOF'
          {
            "info" : {
              "author" : "xcode",
              "version" : 1
            }
          }
          EOF
          cat > ios/KebabHallal/RoutingAppCoverage.xcassets/RoutingAppCoverage.dataset/Contents.json << 'EOF'
          {
            "info" : {
              "author" : "xcode",
              "version" : 1
            },
            "properties" : {
              "provides-namespace" : false
            }
          }
          EOF
          cat > ios/KebabHallal/RoutingAppCoverage.xcassets/RoutingAppCoverage.dataset/data.json << 'EOF'
          {
            "metadata" : {
              "version" : 1,
              "template-version" : 1.0
            },
            "regions" : [
              {
                "country-code" : "IT",
                "name" : "Italy"
              },
              {
                "country-code" : "PK",
                "name" : "Pakistan"
              }
            ]
          }
          EOF
          echo "RoutingAppCoverage.xcassets created successfully"
          ls -la ios/KebabHallal/RoutingAppCoverage.xcassets/

      - name: Add RoutingAppCoverage to Xcode project
        run: |
          ruby -e '
          require "xcodeproj"
          
          project_path = "ios/KebabHallal.xcodeproj"
          project = Xcodeproj::Project.open(project_path)
          
          target = project.targets.find { |t| t.name == "KebabHallal" }
          
          # Check if already added
          existing_ref = project.files.find { |f| f.path&.include?("RoutingAppCoverage.xcassets") }
          
          unless existing_ref
            file_ref = project.main_group.new_reference("KebabHallal/RoutingAppCoverage.xcassets")
            file_ref.last_known_file_type = "folder.assetcatalog"
            
            target.source_build_phase.add_file_reference(file_ref)
            
            puts "Added RoutingAppCoverage.xcassets to Xcode project"
          else
            puts "RoutingAppCoverage.xcassets already in project"
          end
          
          project.save
          '

      - name: Configure code signing on app target only
        run: |
          python3 -c "
          import os
          pbxproj = 'ios/KebabHallal.xcodeproj/project.pbxproj'
          with open(pbxproj, 'r') as f:
              content = f.read()
          content = content.replace(
              'PRODUCT_BUNDLE_IDENTIFIER = com.mh.kebabhallal;',
              'PRODUCT_BUNDLE_IDENTIFIER = com.mh.kebabhallal;\n\t\t\t\tPROVISIONING_PROFILE_SPECIFIER = \"' + os.environ['PROFILE_UUID'] + '\";\n\t\t\t\tCODE_SIGN_STYLE = Manual;'
          )
          with open(pbxproj, 'w') as f:
              f.write(content)
          print('Successfully injected manual signing and profile into KebabHallal target')
          "

      - name: Install CocoaPods
        run: pod install
        working-directory: iOS-App/ios

      - name: Build IPA
        run: |
          cd ios

          # Find project name
          XCODEPROJ=$(find . -name "*.xcodeproj" -maxdepth 1 | head -1)
          PROJECT_NAME=$(basename "$XCODEPROJ" .xcodeproj)
          TEAM_ID="${{ secrets.APPLE_TEAM_ID || '9NY2HWU6U2' }}"
          SIGNING_IDENTITY="${CERT_IDENTITY:-iPhone Distribution}"
          BUNDLE_ID="com.mh.kebabhallal"

          # Export options for manual distribution signing
          cat > "$RUNNER_TEMP/ExportOptions.plist" << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>teamID</key>
            <string>${TEAM_ID}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>${SIGNING_IDENTITY}</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>${BUNDLE_ID}</key>
              <string>${PROFILE_UUID}</string>
            </dict>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          EOF

          # Build and Archive (without global PROVISIONING_PROFILE_SPECIFIER so Pods are not affected)
          xcodebuild \
            -workspace "${PROJECT_NAME}.xcworkspace" \
            -scheme "$PROJECT_NAME" \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/app.xcarchive" \
            -destination "generic/platform=iOS" \
            DEVELOPMENT_TEAM="${TEAM_ID}" \
            CODE_SIGN_IDENTITY="${SIGNING_IDENTITY}" \
            clean archive

          # Export IPA
          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/app.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/ipa-output"

      - name: Upload IPA artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kebab-hallal-ios-${{ github.sha }}
          path: ${{ runner.temp }}/ipa-output/*.ipa
          retention-days: 30
          if-no-files-found: error

      - name: Upload RoutingAppCoverage artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: RoutingAppCoverage
          path: iOS-App/ios/KebabHallal/RoutingAppCoverage.xcassets
          retention-days: 30
          if-no-files-found: error

      - name: Cleanup keychain
        if: always()
        run: |
          if [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH"
          fi
